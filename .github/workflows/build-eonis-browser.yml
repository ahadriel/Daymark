name: Build EONIS Browser APK

on:
  workflow_dispatch:
  push:
    branches: [eonis-browser]
    paths:
      - "android-browser/**"
      - ".github/workflows/build-eonis-browser.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-browser
        run: gradle assembleDebug --stacktrace

      - name: Prepare appbuild output
        run: |
          mkdir -p appbuild
          cp android-browser/app/build/outputs/apk/debug/app-debug.apk appbuild/EONIS-Browser.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eonis-browser-apk
          path: appbuild/EONIS-Browser.apk
          if-no-files-found: error
          retention-days: 14
