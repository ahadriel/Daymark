name: Build Daymark APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: daymark-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Daymark
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Daymark web app
        run: pnpm build

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi

      - name: Sync web app into Android project
        run: pnpm exec cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Put APK in appbuild
        run: |
          mkdir -p appbuild
          cp android/app/build/outputs/apk/debug/app-debug.apk appbuild/Daymark.apk

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daymark-APK
          path: appbuild/Daymark.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK to appbuild folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appbuild/Daymark.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; nothing to commit."
          else
            git commit -m "Build Daymark Android APK"
            git push
          fi
