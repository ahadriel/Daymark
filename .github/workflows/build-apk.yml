name: Build EONIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: eonis-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out EONIS
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build EONIS web app
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi

      - name: Apply EONIS launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/drawable/eonis_launcher_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <corners android:radius="28dp" />
            <solid android:color="#0A1120" />
          </shape>
          EOF
          cat > android/app/src/main/res/drawable/eonis_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="128" android:viewportHeight="128">
            <path android:fillColor="#172744" android:pathData="M31,0 L97,0 Q128,0 128,31 L128,97 Q128,128 97,128 L31,128 Q0,128 0,97 L0,31 Q0,0 31,0 Z" />
            <path android:fillColor="#00000000" android:strokeColor="#B9CEFF"
                android:strokeWidth="7" android:strokeLineCap="round"
                android:pathData="M64,33 A14,14 0 1,1 64,61 A14,14 0 1,1 64,33" />
            <path android:fillColor="#00000000" android:strokeColor="#E7EEFF"
                android:strokeWidth="6" android:strokeLineCap="round"
                android:pathData="M25,72 L103,72" />
            <path android:fillColor="#00000000" android:strokeColor="#648EFF"
                android:strokeWidth="8" android:strokeLineCap="round" android:strokeLineJoin="round"
                android:pathData="M34,94 L52,76 L65,88 L94,57" />
            <path android:fillColor="#B9CEFF" android:pathData="M99,57 A4,4 0 1,1 91,57 A4,4 0 1,1 99,57" />
          </vector>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/eonis_launcher_background" />
            <foreground android:drawable="@drawable/eonis_launcher_foreground" />
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/eonis_launcher_background" />
            <foreground android:drawable="@drawable/eonis_launcher_foreground" />
          </adaptive-icon>
          EOF

      - name: Sync web app into Android project
        run: pnpm exec cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Put APK in appbuild
        run: |
          mkdir -p appbuild
          cp android/app/build/outputs/apk/debug/app-debug.apk appbuild/EONIS.apk

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: EONIS-APK
          path: appbuild/EONIS.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK to appbuild folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appbuild/EONIS.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; nothing to commit."
          else
            git commit -m "Build EONIS Android APK"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
