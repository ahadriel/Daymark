project_id = "daymark"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "https://*.github.io/**", "com.daymark.app://**"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
